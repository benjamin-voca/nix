# Template for UPG asset-storage secrets.
# Do NOT commit real credentials.
#
# Preferred path: store values in secrets/roles/backbone.yaml via `sops`
# (keys: upg-assets-git-token, upg-assets-git-username, upg-assets-sftpgo-users-json)
# and let k8s-secrets-inject create the Kubernetes Secrets.
#
# Manual bootstrap (until SOPS is updated / backbone redeployed):
#
#   kubectl create namespace upg-assets --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n upg-assets create secret generic upg-assets-git \
#     --from-literal=username=oauth2 \
#     --from-literal=token='REPLACE_WITH_FORGEJO_TOKEN' \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n upg-assets create secret generic upg-assets-sftpgo-users \
#     --from-file=users.json=./users.json \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Forgejo token scopes needed: read:repository, write:repository
# Create under a bot user or as a deploy token for farbeam/upg.
#
# users.json is an SFTPGo portable data dump. Generate bcrypt hashes and
# set home_dir to e.g. /workspace/UltimateBladeGrounds/Benimaru for scoping.
---
apiVersion: v1
kind: Secret
metadata:
  name: upg-assets-git
  namespace: upg-assets
  labels:
    app.kubernetes.io/name: upg-assets
type: Opaque
stringData:
  username: oauth2
  token: REPLACE_WITH_FORGEJO_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: upg-assets-sftpgo-users
  namespace: upg-assets
  labels:
    app.kubernetes.io/name: upg-assets
type: Opaque
stringData:
  users.json: |
    {
      "users": [
        {
          "id": 1,
          "status": 1,
          "username": "artist",
          "password": "REPLACE_WITH_BCRYPT_HASH",
          "home_dir": "/workspace/UltimateBladeGrounds",
          "uid": 0,
          "gid": 0,
          "permissions": { "/": ["*"] },
          "filesystem": { "provider": 0 }
        }
      ],
      "folders": [],
      "groups": [],
      "admins": [],
      "api_keys": [],
      "shares": [],
      "event_actions": [],
      "event_rules": []
    }
