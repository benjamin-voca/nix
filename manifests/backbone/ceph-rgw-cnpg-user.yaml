apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: cnpg-backups
  namespace: rook-ceph
spec:
  store: ceph-objectstore
  displayName: CNPG Backups
  # Quota re-enabled 2026-09-24 ~19:30 after the orphan purge returned the
  # pool to ~0.4GiB stored. 150Gi ≫ steady state of 2d retention; it trips
  # only on runaway growth (S3 writes fail → CNPGBackup alerts fire) while
  # the databases keep running. See git history for the incident notes.
  quotas:
    maxSize: 150Gi
    maxBuckets: 10
